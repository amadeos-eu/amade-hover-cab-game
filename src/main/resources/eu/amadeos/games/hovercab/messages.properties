dialog.about.text=Fly a cab with jets against gravity and wind, land on numbered pads, pick up the passengers who hail you and take them where they want to go.
dialog.about.rules=The main jet under the cab lifts it, the side jets steer, the roof jet pushes down; jets burn fuel, which the green fuel pad sells. Land only with the gear out (Space), slowly, and fully on the deck of a pad: everything else is a crash. A passenger pays the fare by distance and a tip that melts during the ride; a hard landing costs a dollar of it. The last passenger of a shift wants up: fly out through the gate in the ceiling. Every hundred dollars earned give a spare cab. P pauses, F11 switches to full screen and back.
