dialog.about.text=Pilota un taxi con propulsores contra la gravedad y el viento, aterriza en plataformas numeradas, recoge a los pasajeros que te llaman y llévalos adonde quieren ir.
dialog.about.rules=El propulsor principal bajo el taxi lo eleva, los laterales lo dirigen y el del techo empuja hacia abajo; los propulsores gastan combustible, que vende la plataforma verde. Aterriza solo con el tren fuera (Espacio), despacio y por completo sobre la cubierta de una plataforma: todo lo demás es un choque. Cada pasajero paga la tarifa según la distancia y una propina que se derrite durante el viaje; un aterrizaje brusco cuesta un dólar de ella. El último pasajero de un turno quiere subir: sal por la compuerta del techo. Cada cien dólares ganados dan un taxi de reserva. P pausa, F11 cambia a pantalla completa y vuelve.
