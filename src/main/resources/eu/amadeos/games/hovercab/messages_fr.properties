dialog.about.text=Pilotez un taxi à réacteurs contre la gravité et le vent, posez-vous sur des plateformes numérotées, prenez les passagers qui vous hèlent et emmenez-les où ils veulent aller.
dialog.about.rules=Le réacteur principal sous le taxi le soulève, les latéraux le dirigent, celui du toit pousse vers le bas ; les réacteurs brûlent du carburant, que vend la plateforme verte. Posez-vous uniquement train sorti (Espace), lentement et entièrement sur le pont d'une plateforme : tout le reste est un crash. Un passager paie la course selon la distance et un pourboire qui fond pendant le trajet ; un atterrissage brutal en coûte un dollar. Le dernier passager d'un service veut monter : sortez par la trappe du plafond. Chaque centaine de dollars gagnés donne un taxi de réserve. P met en pause, F11 passe en plein écran et revient.
