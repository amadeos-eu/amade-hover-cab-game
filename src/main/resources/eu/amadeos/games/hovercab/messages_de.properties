dialog.about.text=Flieg ein Taxi mit Düsen gegen Schwerkraft und Wind, lande auf nummerierten Plattformen, nimm die Fahrgäste auf, die dich rufen, und bring sie, wohin sie wollen.
dialog.about.rules=Die Hauptdüse unter dem Taxi hebt es, die Seitendüsen lenken, die Dachdüse drückt nach unten; die Düsen verbrauchen Treibstoff, den die grüne Tankplattform verkauft. Lande nur mit ausgefahrenem Fahrwerk (Leertaste), langsam und ganz auf dem Deck einer Plattform: alles andere ist ein Absturz. Ein Fahrgast zahlt den Fahrpreis nach der Entfernung und ein Trinkgeld, das während der Fahrt schmilzt; eine harte Landung kostet einen Dollar davon. Der letzte Fahrgast einer Schicht will nach oben: flieg durch das Tor in der Decke hinaus. Alle hundert verdienten Dollar gibt es ein Ersatztaxi. P hält an, F11 schaltet auf Vollbild und zurück.
