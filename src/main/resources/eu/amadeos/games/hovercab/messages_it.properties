about.gamepads=Gamepad: {0}, {1} collegati
dialog.about.text=Pilota un taxi a getti contro la gravità e il vento, atterra su piazzole numerate, prendi i passeggeri che ti chiamano e portali dove vogliono andare.
dialog.about.rules=Il getto principale sotto il taxi lo solleva, quelli laterali lo guidano, quello sul tetto spinge in giù; i getti consumano carburante, che la piazzola verde vende. Atterra solo con il carrello fuori (Spazio), piano e del tutto sul ponte di una piazzola: tutto il resto è uno schianto. Un passeggero paga la corsa in base alla distanza e una mancia che si scioglie durante il viaggio; un atterraggio duro ne costa un dollaro. L'ultimo passeggero di un turno vuole salire: esci dal portello nel soffitto. Ogni cento dollari guadagnati danno un taxi di riserva. P mette in pausa, F11 passa a schermo intero e ritorna.
