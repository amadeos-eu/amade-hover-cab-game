plugins {
    id 'java'
    id 'application'
}

group = 'eu.amadeos'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
def debVersion = version.toString().replace('-', '~')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'eu.amadeos.games.hovercab.bootstrap.AmadeHoverCabApplication'
    // Gamepads on Windows are read through java.lang.foreign; without this, Java warns about it.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Bodies, thrusters and touchdowns, pixel masks, the talking machine, distance maps for the autopilot,
    // data files, gamepads, loop, canvas, sprites, particles, sound and music, high scores and the standard
    // game menu; brings amade-commons (theme, Motif look, start-up, XDG).
    // With ../amade-game-engine checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.amadeos-eu:amade-game-engine:v1.0.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

jar {
    archiveBaseName = 'amade-hover-cab-game'
    manifest {
        attributes(
            'Main-Class': 'eu.amadeos.games.hovercab.bootstrap.AmadeHoverCabApplication',
            'Implementation-Title': 'amade-hover-cab-game',
            'Implementation-Version': project.version,
            // java -jar: the gamepads on Windows call XInput through java.lang.foreign without a warning.
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-hover-cab-game'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-hover-cab-game')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-hover-cab-game')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-hover-cab-game.jar' }
        }

        def launcher = new File(binDir, 'amade-hover-cab-game')
        launcher.text = """#!/bin/sh
exec /usr/bin/java -jar /opt/amade-hover-cab-game/amade-hover-cab-game.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-hover-cab-game.desktop'
            into appDir
        }
        // AppStream metadata: name, description and screenshot for amadeOS Software (and a repository's
        // appstream-generator).
        copy {
            from 'packaging/eu.amadeos.games.hovercab.metainfo.xml'
            into new File(stagingDir, "usr/share/metainfo")
        }
        copy {
            from 'src/main/resources/icons/amade-hover-cab-game.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }

        new File(debianDir, 'control').text = """Package: amade-hover-cab-game
Version: ${debVersion}
Section: games
Priority: optional
Architecture: all
Depends: openjdk-25-jre | java-runtime (>= 25)
Maintainer: amadeOS Project <developers@datazuul.com>
Description: Flying cab game for amadeOS
 Fly a cab with thrusters against gravity and wind, land gently on
 numbered pads, pick up the passengers who hail you and take them where
 they want to go, before their tip melts away. Twelve shifts, from the
 harbour to an orbit station, passengers with voices of their own,
 fuel to buy and high scores. Keyboard or gamepad. Part of the amadeOS
 games.
"""

        def debFile = new File(distDir, "amade-hover-cab-game_${debVersion}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
    }
}

tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-hover-cab-game_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}

// Windows installer with jpackage: the fat jar plus a Java runtime, so Windows users need no Java.
// jpackage builds Windows packages only on Windows; MSI and EXE also need WiX Toolset 3 on the PATH.
//   ./gradlew windowsInstaller                           (MSI; output in build/windows/<type>/)
//   ./gradlew windowsInstaller -PinstallerType=exe       (setup .exe)
//   ./gradlew windowsInstaller -PinstallerType=app-image (folder with amade-hover-cab-game.exe, no WiX needed)
tasks.register('windowsInstaller') {
    dependsOn jar
    description = 'Builds a Windows installer (MSI, EXE or app image) with jpackage'
    group = 'distribution'

    def jdk = javaToolchains.launcherFor { languageVersion = java.toolchain.languageVersion }
    doLast {
        if (!System.getProperty('os.name').startsWith('Windows')) {
            throw new GradleException('jpackage builds Windows packages only on Windows')
        }
        def type = project.findProperty('installerType') ?: 'msi'
        def buildDirFile = layout.buildDirectory.get().asFile
        // jpackage bundles everything in --input, so give it a folder with just the fat jar.
        def inputDir = new File(buildDirFile, 'jpackage-input')
        def destDir = new File(buildDirFile, "windows/$type")
        delete(inputDir, destDir)
        copy {
            from jar.archiveFile
            into inputDir
        }

        def jpackage = jdk.get().metadata.installationPath.file('bin/jpackage.exe').asFile
        def args = [jpackage.absolutePath,
                    '--type', type,
                    '--name', 'amade-hover-cab-game',
                    // MSI versions are numeric only: 0.1.0-SNAPSHOT becomes 0.1.0
                    '--app-version', project.version.toString().replaceAll(/[^0-9.].*$/, ''),
                    '--vendor', 'datazuul',
                    '--description', 'Fly a cab against gravity, land on pads and carry passengers',
                    '--copyright', 'datazuul, licensed under the EUPL-1.2',
                    '--input', inputDir.absolutePath,
                    '--main-jar', jar.archiveFile.get().asFile.name,
                    '--main-class', application.mainClass.get(),
                    '--java-options', '--enable-native-access=ALL-UNNAMED',
                    '--icon', file('packaging/windows/amade-hover-cab-game.ico').absolutePath,
                    '--dest', destDir.absolutePath]
        if (type != 'app-image') {
            args += ['--win-menu', '--win-menu-group', 'amadeOS Games', '--win-shortcut', '--win-dir-chooser',
                     '--license-file', file('LICENSE').absolutePath,
                     // Never change: lets a newer installer replace an installed version.
                     '--win-upgrade-uuid', '6588092b-dc1b-490f-87a0-e71186ae1380']
        }

        def process = new ProcessBuilder(args).redirectErrorStream(true).start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('jpackage failed')
        }
        destDir.eachFile { println "[windowsInstaller] Created ${it.absolutePath}" }
    }
}

// How long the frames of each shift take: ./gradlew benchmark (needs a display; xvfb-run on servers)
tasks.register('benchmark', JavaExec) {
    description = 'Measures the frame times of the shifts'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.games.hovercab.ui.game.Benchmark'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// The screenshots of chapter 28, drawn without a screen: ./gradlew screenshots -Pshots=<folder>
tasks.register('screenshots', JavaExec) {
    description = 'Draws the screenshots of the handbook chapter'
    group = 'documentation'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.games.hovercab.ui.game.Screenshots'
    args = [project.findProperty('shots') ?: layout.buildDirectory.dir('screenshots').get().asFile.path]
}

